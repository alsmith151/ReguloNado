      ``core_regions.bed`` to optimise only the core rather than the whole candidate.


      Doubles as the single-run config consumed by ``regulonado attribute --params``:
      a workflow

      YAML sets ``targets`` to several entries and lets the pipeline resolve checkpoints/paths
      per

      (target, shard); a standalone CLI run sets ``targets`` to exactly one entry
      and supplies

      ``fasta``/``intervals``-or-``dataset_dir``/``out_dir``/``checkpoint_dirs`` directly
