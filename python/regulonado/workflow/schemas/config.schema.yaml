        - type: string
        - type: 'null'
        default: null
        description: Cell-type target group this run trains for (e.g. 'HL-60'), passed
          to 'train-regions' as --target-group; required by the 'target' preset's
          contrast objective.
        title: Target Group
      settings:
        additionalProperties: true
        title: Settings
        type: object
    required:
    - name
    - seed
    - embedding
    title: RegionsTrainRun
    type: object
  ScalingConfig:
    additionalProperties: false
    properties:
      method:
        default: tmm
        enum:
        - tmm
        - original
        - bamnado
        - seqnado
        - anchor
        title: Method
        type: string
      anchor_regions:
        anyOf:
        - type: string
        - type: 'null'
        default: null
        title: Anchor Regions
      background_regions:
        anyOf:
        - type: string
        - type: 'null'
        default: null
        title: Background Regions
      heldout_regions:
        anyOf:
        - type: string
        - type: 'null'
        default: null
        title: Heldout Regions
      window_stat_bp:
        default: 1000
        minimum: 1
        title: Window Stat Bp
        type: integer
      window_stat_bp_by_assay:
        anyOf:
        - additionalProperties:
            type: integer
          type: object
        - type: 'null'
        default: null
        title: Window Stat Bp By Assay
      background_sample:
        anyOf:
        - minimum: 1
          type: integer
        - type: 'null'
        default: 5000
        title: Background Sample
      bamnado_method:
        anyOf:
        - enum:
          - tmm
          - csaw-background
          - cpm
          - median-of-ratios
          - spike-in
          type: string
        - type: 'null'
        default: null
        title: Bamnado Method
      bamnado_exogenous_prefix:
        anyOf:
        - type: string
        - type: 'null'
        default: null
        title: Bamnado Exogenous Prefix
      seqnado_project:
        anyOf:
        - type: string
        - type: 'null'
        default: null
        description: SeqNado output dir whose normalisation factors to reuse (method
          'seqnado').
        title: Seqnado Project
      seqnado_spikein_method:
        anyOf:
        - type: string
        - type: 'null'
        default: null
        description: Which resources/<method>/normalisation_factors.tsv to read.
        title: Seqnado Spikein Method
    title: ScalingConfig
    type: object
  SeqNadoProjectRef:
    additionalProperties: false
    description: A SeqNado output directory contributing tracks to this dataset.
    properties:
      name:
        description: Namespace label; prefixes track names when aggregating.
        title: Name
        type: string
      path:
        description: Path to the SeqNado output directory (seqnado_output/).
        title: Path
        type: string
      method:
        anyOf:
        - type: string
        - type: 'null'
        default: deeptools
        description: Pileup method to take.
        title: Method
      scale:
        anyOf:
        - type: string
        - type: 'null'
        default: unscaled
        description: Scaling variant to take.
        title: Scale
    required:
    - name
    - path
    title: SeqNadoProjectRef
    type: object
  TrainConfig:
    additionalProperties: false
    properties:
      nproc_per_node:
        default: 1
        minimum: 1
        title: Nproc Per Node
        type: integer
      common:
        additionalProperties: true
        title: Common
        type: object
      phases:
        items:
          $ref: '#/$defs/TrainPhase'
        minItems: 1
        title: Phases
        type: array
      runs:
        items:
          $ref: '#/$defs/TrainRun'
        minItems: 1
        title: Runs
        type: array
    required:
    - phases
    - runs
    title: TrainConfig
    type: object
  TrainPhase:
    additionalProperties: false
    properties:
      name:
        title: Name
        type: string
      preset:
        enum:
        - head_only
        - unfreeze_output
        - deep_finetune
        - peak_finetune
        - lora_finetune
        title: Preset
        type: string
      settings:
        additionalProperties: true
        title: Settings
        type: object
    required:
    - name
    - preset
    title: TrainPhase
    type: object
  TrainRun:
    additionalProperties: false
    properties:
      name:
        title: Name
        type: string
      seed:
        minimum: 0
        title: Seed
        type: integer
      pretrained_model:
        title: Pretrained Model
        type: string
      settings:
        additionalProperties: true
        title: Settings
        type: object
    required:
    - name
    - seed
    - pretrained_model
    title: TrainRun
    type: object
