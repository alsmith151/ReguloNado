$schema: "https://json-schema.org/draft/2020-12/schema"
type: object
additionalProperties: false
required: [results_dir, inputs, build, recompress, scaling, train]
properties:
  results_dir:
    type: string
    minLength: 1
  inputs:
    type: object
    additionalProperties: false
    required: [intervals, fasta]
    # Tracks come from a plain directory, a track sheet, or one or more SeqNado
    # projects. Exactly one source is not required — a sheet may name the
    # projects it draws paths from — but at least one must be present.
    anyOf:
      - required: [bigwig_dir]
      - required: [track_sheet]
      - required: [seqnado_projects]
    properties:
      intervals: {type: string, minLength: 1}
      fasta: {type: string, minLength: 1}
      bigwig_dir: {type: string, minLength: 1}
      track_sheet:
        type: string
        minLength: 1
        description: >-
          CSV mapping each track to its annotation (condition, source, ip, ...).
          Column names follow SeqNado's design sheet. Rows may give only a
          sample_id when seqnado_projects can resolve the paths.
      seqnado_projects:
        type: array
        minItems: 1
        description: >-
          SeqNado output directories contributing tracks. Every project must use
          the same reference genome. With more than one, track names are
          namespaced '<project>__<sample>' and categorical ids are assigned over
          the union of all projects.
        items:
          type: object
          additionalProperties: false
          required: [name, path]
          properties:
            name: {$ref: "#/$defs/name"}
            path: {type: string, minLength: 1}
            method: {type: string, minLength: 1}
            scale: {type: string, minLength: 1}
      bam_dir:
        type: string
        minLength: 1
        description: >-
          Directory of BAM files, one per track, named <track-stem>.bam.
          Required only when scaling.method is 'bamnado'.
  build:
    type: object
    additionalProperties: false
    required:
      - context_length
      - bin_size
      - n_pred_bins
      - shift_max_bp
      - extract_threads
      - arrow_write_threads
      - arrow_batch_size
      - compression
      - stage_to_scratch
      - drop_missing
      - dedupe_tracks
    properties:
      context_length: {type: integer, minimum: 1}
      bin_size: {type: integer, minimum: 1}
      n_pred_bins: {type: integer, minimum: 1}
      shift_max_bp: {type: integer, minimum: 0}
      extract_threads: {type: integer, minimum: 1}
      arrow_write_threads: {type: integer, minimum: 1}
      arrow_batch_size: {type: integer, minimum: 1}
      compression: {type: string, minLength: 1}
      stage_to_scratch: {type: boolean}
      drop_missing: {type: boolean}
      dedupe_tracks: {type: string, minLength: 1}
  recompress:
    type: object
    additionalProperties: false
    required: [enabled, zstd_level, max_batch_size, workers]
    properties:
      enabled: {type: boolean}
      zstd_level: {type: integer}
      max_batch_size: {type: integer, minimum: 1}
      workers: {type: integer, minimum: 1}
  scaling:
    type: object
    additionalProperties: false
    required: [method]
    properties:
      method: {enum: [tmm, original, bamnado, seqnado]}
      bamnado_method:
        enum: [tmm, csaw-background, cpm, median-of-ratios, spike-in]
        description: >-
          bamnado bam-normalize method to use when scaling.method is
          'bamnado'. Defaults to bamnado's own default (csaw-background).
      bamnado_exogenous_prefix:
        type: string
        minLength: 1
        description: Reference-name prefix for spike-in sequences (bamnado_method 'spike-in').
      seqnado_project:
        type: string
        minLength: 1
        description: >-
          SeqNado output directory whose spike-in normalisation factors to reuse
          (scaling.method 'seqnado'). Factors are only comparable within one
          project, so this names exactly one even when several are aggregated.
      seqnado_spikein_method:
        type: string
        minLength: 1
        description: >-
          Which resources/<method>/normalisation_factors.tsv to read. Defaults to
          the only one present.
  train:
    type: object
    additionalProperties: false
    required: [nproc_per_node, phases, runs]
    properties:
      nproc_per_node: {type: integer, minimum: 1}
      common: {$ref: "#/$defs/settings"}
      phases:
        type: array
        minItems: 1
        items:
          type: object
          additionalProperties: false
          required: [name, preset]
          properties:
            name: {$ref: "#/$defs/name"}
            preset:
              enum: [head_only, unfreeze_output, deep_finetune, peak_finetune]
            settings: {$ref: "#/$defs/settings"}
      runs:
        type: array
        minItems: 1
        items:
          type: object
          additionalProperties: false
          required: [name, seed, pretrained_model]
          properties:
            name: {$ref: "#/$defs/name"}
            seed: {type: integer, minimum: 0}
            pretrained_model: {type: string, minLength: 1}
            settings: {$ref: "#/$defs/settings"}
  design:
    type: object
    additionalProperties: false
    required: [candidates, targets]
    description: >-
      Optional synthetic-enhancer-design stage. Absent means the workflow behaves exactly as it
      does today.
    properties:
      candidates: {type: string, minLength: 1}
      shards: {type: integer, minimum: 1}
      holdout_run: {type: string, minLength: 1}
      design_runs:
        type: array
        minItems: 1
        items: {type: string, minLength: 1}
      common: {$ref: "#/$defs/settings"}
      targets:
        type: array
        minItems: 1
        items:
          type: object
          additionalProperties: false
          required: [name, target]
          properties:
            name: {$ref: "#/$defs/name"}
            target: {type: string, minLength: 1}
            group_by: {type: string, minLength: 1}
            method: {enum: [ism, adalead]}
            settings: {$ref: "#/$defs/settings"}
$defs:
  name:
    type: string
    pattern: "^[A-Za-z0-9][A-Za-z0-9._-]*$"
  settings:
    type: object
    additionalProperties: true
