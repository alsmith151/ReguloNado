# Head family selected by build_transfer_learning_head.
type: transfer_mlp
# Hidden channel width inside the transfer head.
hidden: 512
# Dropout applied inside the transfer MLP.
dropout: 0.0
# Intermediate width used by the metadata-free transfer MLP.
mlp_hidden: 1024
# default uses the framework initialization. empirical_mean_bias initializes
# only the final bias; empirical_mean_constant also zeros the final weights so
# every track starts exactly at its transformed training-label mean.
output_init: default
output_init_samples: 256
