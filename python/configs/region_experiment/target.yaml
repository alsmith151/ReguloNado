# @package _global_
# Stage 3: fine-tune on the HL-60 target, weighting train regions by |contrast| of
# data.target_group rather than filtering to it (set data.target_group, e.g. "HL-60").
# Warm-started from the specific stage; the count noise is frozen so the likelihood cannot
# down-weight the target by calling it noisy.

data:
  specific_only: false
  contrast_weighting: true
  contrast_weight_floor: 0.25
  contrast_weight_cap: 4.0

model:
  count_freeze_noise: true

loss:
  contrast_weight: 1.0
  contrast_task_weight: 1.0

trainer:
  batch_size: 64
  eval_batch_size: 64
  learning_rate: 1.0e-4
  # Lower the learning rate when the stage's metric stalls for an epoch (4 evaluations);
  # stop after 3 epochs without improvement, by which time it has been lowered twice.
  scheduler: reduce_lr_on_plateau
  lr_plateau_factor: 0.3
  lr_plateau_patience: 4
  max_epochs: 30
  evals_per_epoch: 4
  report_to: [wandb]
  metric_for_best_model: eval_contrast_pearson_mean
  greater_is_better: true
  early_stopping_patience: 12
