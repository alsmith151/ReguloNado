defaults:
  - backbone: borzoi
  - head: transfer_mlp
  - loss: poisson_multinomial
  - _self_

# Override these values directly or start from one of the experiment presets.
seed: 42
output_dir: ${hydra:runtime.output_dir}

data:
  # Dataset directory created by `regulonado dataset`.
  path: ???
  # Optional enriched metadata file. null uses metadata stored with the dataset.
  metadata_path: null
  apply_scale: true
  apply_squash: true
  apply_clip: true
  streaming: false
  shuffle_buffer_ram_gb: 8.0
  enable_rc_aug: false
  context_length: 524288
  n_pred_bins: 6144

model:
  use_track_metadata: false
  share_condition_base_channels: false
  metadata_hidden: 32
  activation_type: softplus

trainer:
  # Data loading
  batch_size: 1
  eval_batch_size: 1
  num_workers: 8
  persistent_workers: true
  prefetch_factor: 2

  # Optimisation
  learning_rate: 1.0e-3
  backbone_learning_rate: 1.0e-4
  weight_decay: 1.0e-2
  scheduler: linear
  warmup_steps: 0
  max_epochs: 1
  max_steps: null
  gradient_accumulation_steps: 1
  mixed_precision: bf16
  gradient_clip_norm: 1.0

  # Logging, evaluation, and checkpoints
  log_every_n_steps: 50
  eval_every_n_steps: null
  checkpoint_every_n_steps: null
  metric_for_best_model: eval_loss
  greater_is_better: false
  topk_bins: 256
  early_stopping_patience: null
  early_stopping_threshold: 0.0
  eval_accumulation_steps: null
  max_eval_samples: null
  eval_on_start: true
  num_plot_examples: 4
  report_to: []

  # Backbone and restart behavior
  freeze_backbone: true
  unfreeze_backbone_stages_from_output_end: 0
  unfreeze_module_names: []
  resume_from_checkpoint: null
  init_weights_from_checkpoint: null

  provenance:
    enabled: true
    save_git_diff: true

hydra:
  run:
    dir: outputs/train/${now:%Y-%m-%d}/${now:%H-%M-%S}
  sweep:
    dir: multirun/${now:%Y-%m-%d}/${now:%H-%M-%S}
    subdir: ${hydra.job.num}
