# @package _global_
# Sharp transfer learning — STANDARD poisson_multinomial loss, aggressively tuned.
#
# A drop-in comparison to `sharp_transfer_learning` (same backbone/head/trainer and the same
# sharp target dataset) that keeps the stock Borzoi poisson_multinomial loss instead of the
# transfer_calibration loss. The loss has a single knob — `poisson_weight`, the weight on the
# Poisson *total-count* term relative to the multinomial profile term. The stock default is
# 0.2 (profile-dominated, amplitude-blind, prone to flat/over-active predictions on sharp
# data). Here it is pushed to 2.0 (10x) so per-track magnitude is penalised hard.
#
# Note: the Poisson term here is on the summed total count, not per bin — it constrains how
# much total signal a window gets but not where it goes. To penalise per-bin fake peaks
# directly, use a per-bin Poisson loss instead (see the plan / poisson_multinomial_binwise).
#
# Usage:
#   DATA_DIR=/ceph/.../<sharp-target-dataset> \
#   EXPERIMENT=sharp_transfer_poisson_aggressive \
#   [INIT_WEIGHTS_FROM_CHECKPOINT=<head-only checkpoint>] \
#   sbatch scripts/train_slurm.sh

defaults:
  - override /backbone: borzoi
  - override /head: transfer_mlp
  - override /loss: poisson_multinomial

data:
  streaming: true
  enable_rc_aug: true
  # Keep scale + clip; drop squash so the magnitude term sees the true dynamic range.
  apply_scale: true
  apply_clip: true
  apply_squash: false

model:
  use_track_metadata: false
  share_condition_base_channels: false

loss:
  # Aggressive total-count weight: 10x the stock 0.2 so per-track magnitude dominates the
  # profile-shape term. Dial toward 1.0 if peaks over-sharpen or training destabilises.
  poisson_weight: 2.0

trainer:
  batch_size: 8
  eval_batch_size: 8
  num_workers: 8

  learning_rate: 5.0e-4
  backbone_learning_rate: 1.0e-5
  weight_decay: 1.0e-2
  scheduler: cosine
  warmup_steps: 500
  max_steps: 10000

  gradient_accumulation_steps: 2
  mixed_precision: bf16
  gradient_clip_norm: 1.0

  log_every_n_steps: 10
  eval_every_n_steps: 500
  checkpoint_every_n_steps: 500

  # Unfreeze the final 2 backbone stages at a low LR; everything deeper stays frozen.
  freeze_backbone: true
  unfreeze_backbone_stages_from_output_end: 2

  report_to: [wandb]
  # Amplitude-aware selection — with the heavy Poisson term, eval_loss tracks magnitude error.
  metric_for_best_model: eval_loss
  greater_is_better: false
  topk_bins: 128

  max_eval_samples: 500
  num_plot_examples: 8
  early_stopping_patience: 5

  init_weights_from_checkpoint: ${oc.env:INIT_WEIGHTS_FROM_CHECKPOINT,""}
