# @package _global_
# Phase 2: adapt the last two backbone stages after head-only training.

defaults:
  - override /backbone: borzoi
  - override /head: transfer_mlp
  - override /loss: poisson_multinomial

data:
  streaming: true
  enable_rc_aug: true

model:
  use_track_metadata: false
  share_condition_base_channels: false

trainer:
  batch_size: 12
  eval_batch_size: 12
  num_workers: 8
  persistent_workers: false
  learning_rate: 2.0e-4
  backbone_learning_rate: 2.0e-6
  weight_decay: 1.0e-2
  scheduler: cosine
  warmup_steps: 200
  max_steps: 10000
  gradient_accumulation_steps: 1
  mixed_precision: bf16
  gradient_clip_norm: 1.0
  log_every_n_steps: 10
  eval_every_n_steps: 500
  checkpoint_every_n_steps: 500
  freeze_backbone: true
  unfreeze_backbone_stages_from_output_end: 2
  report_to: [wandb]
  metric_for_best_model: pearson_bin_median
  greater_is_better: true
  max_eval_samples: 500
  early_stopping_patience: 5
