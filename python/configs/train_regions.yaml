# Region-count head training (python/regulonado/training/regions/). Features come from
# either:
#   - a cached trunk: data.embeddings_dir (`regulonado embed regions`); only the head trains;
#   - a live trunk: data.fasta + data.input_length + a backbone group (backbone=alphagenome);
#     the trunk runs every step on each region's window and trains per trunk.* below.
#
# Override these values directly or start from a `region_experiment/*` preset with
# `+region_experiment=<name>`, mirroring `+experiment=<name>` for `regulonado train`.
defaults:
  - backbone: null
  - _self_

seed: 42
output_dir: ${hydra:runtime.output_dir}

data:
  # RegionCountData run directory (regulonado counts gather).
  path: ???
  # Embeddings cache directory (regulonado embed regions): a cached trunk. Leave empty for a
  # live trunk.
  embeddings_dir: ""
  # Live trunk only: genome FASTA, bp of sequence read per region (a multiple of the
  # backbone's bin size; the region's bins sit centrally), a train-time random window shift
  # of up to shift_max bp, and the bp width bins are averaged to (as `embed --pool-to`).
  fasta: ""
  input_length: null
  shift_max: 0
  pool_to: null
  # Group (cell type) name stage 2/3 knobs and metrics below are relative to, e.g. "HL-60".
  target_group: null
  # Stage 2: keep only cell type-specific regions (Gini filter at group level).
  specific_only: false
  gini_std_threshold: 1.0
  # Stage 3: weight train regions by |contrast| of target_group instead of filtering to it.
  contrast_weighting: false
  contrast_weight_floor: 0.25
  contrast_weight_cap: 4.0
  # Per-track artefact-count masking, thresholds from the train split only. <= 0 disables it.
  count_mask_quantile: 0.999
  count_mask_factor: 20.0
  # Train mode: randomly serve the reverse-complement pass (cached: when the cache has one;
  # live: reverse-complement the window).
  enable_rc_aug: true
  # Read the whole embeddings cache into RAM once instead of memory-mapping it.
  in_memory: false
  # Diagnostic: train on this many train regions and evaluate on those same regions, so
  # every eval_* metric reports fit to the training data instead of generalisation. A model
  # that cannot score near-perfectly here is limited by its features or capacity, not data.
  overfit_probe: null
  # A region missing from the embeddings cache is an error by default; set true to drop it
  # (with a warning) instead.
  drop_missing_from_cache: false
  # BED/parquet of held-out sequences (e.g. benchmark candidates): train regions overlapping
  # one are dropped at every stage; val/test are untouched. null disables it.
  exclude_regions: null

model:
  # shared: one attention pool over the region's bins for every cell type; per_group: each
  # cell type attends over the bins and reads out on its own.
  pooling: shared
  hidden: 512
  dropout: 0.1
  # Soft cap on the predicted group log rate; null disables it.
  eta_max: null
  count_noise: nb
  count_replicate_offsets: true
  # Freeze CountHead's log_noise (no gradient) -- e.g. for the target stage, so the
  # likelihood cannot down-weight the target task by calling it noisy.
  count_freeze_noise: false
  count_noise_shrinkage: 0.0

loss:
  # Weight of the per-region centred log-MSE (specificity) loss term; 0 disables it.
  contrast_weight: 0.0
  # log1p multiplier for the contrast term alone; null defaults to the metric's own scale (1.0).
  contrast_multiplier: null
  # Weight of data.target_group inside the contrast term only (every other group is 1.0).
  contrast_task_weight: 1.0

# Live trunk only (training/regions/live.py). finetune: frozen | full | last_blocks
# (unfreeze_last) | adapters (AlphaGenome: lora/ia3/houlsby on the transformer tower via
# alphagenome-pytorch; locon on convolutions, the choice for backbone.features: encoder).
# Trunk parameters train at trainer.backbone_learning_rate (default trainer.learning_rate).
trunk:
  finetune: frozen
  unfreeze_last: 0
  adapters: []
  lora_rank: 8
  lora_alpha: 16
  lora_targets: [q_proj, v_proj]
  ia3_targets: [k_proj, v_proj]
  ia3_ff_targets: []
  houlsby_latent_dim: 8
  houlsby_placement: block
  houlsby_targets: [mha, mlp]
  locon_rank: 4
  locon_alpha: 1
  locon_targets: [down_blocks]
  unfreeze_norm: false
  # Recompute the trunk's blocks in backward instead of storing activations (less memory).
  gradient_checkpointing: false

trainer:
  batch_size: 64
  eval_batch_size: 64
  num_workers: 4
  persistent_workers: true
  prefetch_factor: 2

  learning_rate: 1.0e-3
  weight_decay: 1.0e-2
  scheduler: cosine
  warmup_steps: 0
  max_epochs: 20
  max_steps: null
  gradient_accumulation_steps: 1
  mixed_precision: bf16
  gradient_clip_norm: 1.0

  log_every_n_steps: 50
  eval_every_n_steps: null
  evals_per_epoch: 4
  checkpoint_every_n_steps: null
  metric_for_best_model: eval_contrast_pearson_mean
  greater_is_better: true
  early_stopping_patience: null
  early_stopping_threshold: 0.0
  eval_accumulation_steps: null
  max_eval_samples: null
  eval_on_start: true

  report_to: []
  wandb_project: regulonado-training
  wandb_group: null
  wandb_job_type: training
  wandb_run_name: null
  wandb_tags: []

  resume_from_checkpoint: null
  init_weights_from_checkpoint: null

  provenance:
    enabled: true
    save_git_diff: false

hydra:
  run:
    dir: outputs/train-regions/${now:%Y-%m-%d}/${now:%H-%M-%S}
  sweep:
    dir: multirun-regions/${now:%Y-%m-%d}/${now:%H-%M-%S}
    subdir: ${hydra.job.num}
