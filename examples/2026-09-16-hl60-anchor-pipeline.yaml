# HL-60 / AML-BM atlas production training pipeline.
#
# Builds the anchor-normalised dataset and trains the strongest single configuration
# supported by internal experiments, using conservative choices where direct sweep
# evidence is unavailable. Sweeping, attribution and design are intentionally absent.

results_dir: /path/to/regulonado-results

inputs:
  intervals: /path/to/intervals.bed.gz
  fasta: /path/to/genome.fa
  bigwig_dir: /path/to/bigwigs
  track_annotations: /path/to/track_annotations.parquet

qc:
  checks: [anchor]
  drop_degenerate: true
  max_workers: 16

scaling:
  method: anchor
  anchor_regions: /path/to/common_essential_windows.bed
  background_regions: /path/to/null_windows.parquet
  heldout_regions: /path/to/common_essential_windows_heldout.bed
  window_stat_bp: 1000
  background_sample: 5000

dataset:
  context_length: 524288
  bin_size: 32
  n_pred_bins: 6144
  shift_max_bp: 64
  extract_threads: 32
  write_threads: 4
  zstd_level: 3
  rows_per_row_group: 1
  stage_to_scratch: true
  drop_missing: true
  dedupe_tracks: content

train:
  nproc_per_node: 1
  common:
    data:
      # Anchor-normalised targets remain on their count-like scale for the
      # Poisson-multinomial objective.
      apply_squash: false
      # All included ATAC/ChIP tracks are unstranded, making reverse-complement
      # augmentation a valid low-cost regulariser for deeper fine-tuning.
      enable_rc_aug: true

    model:
      # FiLM explicitly conditions shared sequence features on cell type.
      use_track_metadata: true
      condition_source: group
      share_condition_base_channels: false
      activation_type: softplus_beta2

    head:
      hidden: 2048
      dropout: 0.1
      # Start every output near its empirical target mean instead of forcing the
      # optimiser to spend early updates correcting arbitrary initial depth.
      output_init: empirical_mean_constant
      output_init_samples: 512

    loss:
      # Per-bin Poisson penalises misplaced peaks; multinomial preserves profile
      # shape; the contrast term learns cell-type specificity across ATAC/ChIP.
      poisson_weight: 0.122
      contrast_weight: 0.5
      # Avoid allowing depth-dependent loss magnitude to become an implicit and
      # potentially counterproductive per-track weighting scheme.
      learn_track_weights: false

    trainer:
      batch_size: 12
      eval_batch_size: 12
      num_workers: 8
      persistent_workers: true
      prefetch_factor: 2
      learning_rate: 1.38e-3
      # Conservative adaptation of the pretrained sequence representation. The
      # old 9.9e-4 result was obtained before fp32 master-weight handling was fixed.
      backbone_learning_rate: 1.0e-4
      weight_decay: 4.3e-5
      scheduler: linear
      warmup_steps: 300
      max_epochs: 2
      max_steps: null
      gradient_accumulation_steps: 1
      mixed_precision: bf16
      gradient_clip_norm: 1.0
      log_every_n_steps: 10
      evals_per_epoch: 4
      eval_every_n_steps: null
      checkpoint_every_n_steps: null
      eval_on_start: true
      max_eval_samples: 1500
      metric_for_best_model: contrast_pearson_median
      greater_is_better: true
      early_stopping_patience: null
      # Adapt the output-proximal transformer/decoder stages while retaining the
      # most general early sequence representation.
      freeze_backbone: true
      unfreeze_backbone_stages_from_output_end: 7
      contrast_region_bins: 16
      contrast_pseudocount: 0.1
      contrast_active_fraction: 0.1
      report_to: [wandb]
      wandb_project: regulonado-contrast-correlation
      wandb_tags:
        - anchor-scaled
        - cell-type-contrast
        - contrast-correlation-loss
        - fp32-master-weights
        - unfreeze-7

  phases:
    - name: contrast_correlation
      preset: head_only
      settings:
        head: film
        loss: poisson_multinomial_binwise

  runs:
    - name: contrast_u7_blr1e-4
      seed: 0
      pretrained_model: johahi/flashzoi-replicate-1
