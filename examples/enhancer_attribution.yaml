# ISM attribution -> core NFR pre-selection, chained into design.
#
# `attribute` finds the sub-span of each candidate that actually drives one named track, and
# `design` then optimises only that core. See docs/attribution.md.
#
# Only the attribution/design blocks are shown in detail; the rest mirrors
# examples/bamnado_csaw_folds.yaml.

results_dir: results/bamnado_csaw_folds

inputs:
  intervals: /path/to/intervals.bed
  fasta: /path/to/genome.fa
  bigwig_dir: /path/to/bigwigs
  track_sheet: track_sheet.csv

dataset:
  context_length: 524288
  bin_size: 32
  n_pred_bins: 6144
  shift_max_bp: 64
  extract_threads: 32
  arrow_write_threads: 4
  arrow_batch_size: 512
  compression: lz4
  stage_to_scratch: true
  drop_missing: true
  dedupe_tracks: content

recompress:
  enabled: false
  zstd_level: 3
  max_batch_size: 32
  workers: 4

scaling:
  method: tmm

train:
  nproc_per_node: 1
  phases:
    - {name: peak_finetune, preset: unfreeze_output}
  runs:
    - {name: fold_0, seed: 0, pretrained_model: johahi/flashzoi-replicate-0}
    - {name: fold_1, seed: 1, pretrained_model: johahi/flashzoi-replicate-1}
    - {name: fold_2, seed: 2, pretrained_model: johahi/flashzoi-replicate-2}
    - {name: fold_3, seed: 3, pretrained_model: johahi/flashzoi-replicate-3}

# ── Pre-selection: find each candidate's core ────────────────────────────────
attribution:
  candidates: hl60_specific_shortlist.bed
  shards: 8
  # Attribute with the same folds design will optimise against; fold_3 is left
  # out here so it stays a genuine hold-out downstream.
  runs: [fold_0, fold_1, fold_2]
  stride: 1                 # raise to subsample; keep <= smooth_bp
  smooth_bp: 25
  min_zscore: 1.5           # candidates flatter than this produce no core at all
  fix_width: 250            # synthesis-ready fixed-length cores
  anchor: centroid
  bigwig: true
  targets:
    - name: hl60
      track: atac_hl60        # a single track name, or its index
      settings:
        quantile: 0.92

# ── Design against the cores, not the raw candidates ─────────────────────────
design:
  # Snakemake chains this automatically: the path is the attribution stage's output.
  candidates: results/bamnado_csaw_folds/attribution/hl60/core_regions.bed
  shards: 8
  design_runs: [fold_0, fold_1, fold_2]
  holdout_run: fold_3
  common:
    fold_mode: sequential
    batch_size: 8
    objective: selective-activation
    gain_transform: log2-fold-change
    offtarget_boost_tolerance: 0.138   # log2(1.10)
  targets:
    - name: hl60_core_design
      target: HL-60
      group_by: source
      method: ism
      settings: {rounds: 30, top_k: 1, ism_stride: 1}
