# HL-60 region counts from BAMs, with heads trained on cached trunk embeddings.
#
# Paths are relative to the UEF repo root (2026-08-19-unique-enhancer-finding),
# which is where to run it from:
#
#   regulonado pipeline /path/to/ReguloNado/examples/2026-09-26-hl60-region-counts-alphagenome.yaml train
#
# Transfer learning from a pretrained trunk instead of training a small CNN from
# scratch: each `trunk: cached` run's trunk runs once, at long context, over the UEF
# region set, and a small region-level NB count head trains on the cached embeddings.
# Runs on the same backbone/checkpoint share one cache. See docs/region-counts.md.
#
# The runs compare where specificity comes from: AlphaGenome's full trunk (1 Mb of
# context) and Flashzoi, against AlphaGenome's CNN encoder alone (local sequence, ~1.5 kb
# receptive field) -- then the encoder fine-tuned (LoCon) on each region's own 4 kb
# window, starting from the cached encoder run's head. Set `model: {pooling: per_group}`
# in a run's settings to let each cell type attend over the region's bins on its own.
#
# Only targets.region_counts is configured, so tracks are discovered from the BAMs in
# bam_dir and no bigWig, scaling or profile-dataset rule runs. Each track is named by its
# file stem, the same rule bigWig discovery uses, so one track_annotations file (keyed on
# track_name) serves both. To also fine-tune a profile model on the same tracks, add
# inputs.bigwig_dir, targets.profile and a `trunk: live` run: tracks are then discovered
# from bigWigs, each paired with the BAM of the same stem under bam_dir, and both kinds
# of run train on exactly the same tracks.
#
# track_annotations is also the list of tracks to keep: a discovered BAM with no row in it
# is dropped (status 'unannotated'). Each row gives a 'group' (cell type; target_group
# names one) and an 'assay_class' (ATAC / ChIP / CUT&RUN) or 'assay' alias
# (counts.bam.ASSAY_CLASS_ALIASES), which picks each track's count spec.
results_dir: results/2026-09-26-hl60-region-counts

inputs:
  fasta: /path/to/hg38.fa
  bam_dir: /path/to/atlas/seqnado_output/atac/aligned
  track_annotations: /path/to/track_annotations.parquet

targets:
  region_counts:
    # Already carries a 'split' column (979,917 train / 109,415 val / 73,122 test
    # over 23 chromosomes) and UEF's own target windows, so count targets line up
    # row-for-row with UEF's signal targets.
    regions: data/interim/05-model-dataset/regions-ccre-signal-min1-full/regions.parquet
    target_width: 1000
    threads: 4
    # Same anchor/null windows as UEF's count size factors (bam_counts.load_count_inputs).
    anchor_regions: resources/common_essential_windows.bed
    background_regions: data/interim/01-track-qc/null-windows.parquet
    # All 514 candidate peaks leave training at every phase (UEF --exclude_bed).
    exclude_regions: data/interim/04-examined-outputs/all-kmeans-peak-groups.parquet

train:
  nproc_per_node: 1
  common:
    trainer:
      num_workers: 8
      report_to: [wandb]

  recipes:
    # pretrain -> specific -> target, the UEF v2 curriculum. The presets
    # (python/configs/region_experiment/) set each stage's filtering/weighting; the
    # settings carry over UEF's per-stage selection metric and stage-3 contrast
    # emphasis (configs/train-stage{2,3}-*.args).
    curriculum:
      - name: pretrain
        preset: pretrain
      - name: specific
        preset: specific
        settings:
          trainer:
            metric_for_best_model: eval_contrast_pearson_HL-60
      - name: target
        preset: target
        settings:
          data:
            specific_only: true
            gini_std_threshold: 0.5
          loss:
            contrast_weight: 4.0
            contrast_task_weight: 20.0
          trainer:
            metric_for_best_model: eval_contrast_pearson_top_decile_HL-60
            early_stopping_patience: 8

    # The target stage again, with the trunk fine-tuned live: same data, loss and metric
    # as curriculum's target stage, plus the window, adapter and learning-rate settings.
    encoder_finetune:
      - name: target
        preset: target
        settings:
          data:
            specific_only: true
            gini_std_threshold: 0.5
            input_length: 4096
            shift_max: 32
          loss:
            contrast_weight: 4.0
            contrast_task_weight: 20.0
          trunk:
            finetune: adapters
            adapters: [locon]
            locon_rank: 8
          trainer:
            metric_for_best_model: eval_contrast_pearson_top_decile_HL-60
            early_stopping_patience: 8
            batch_size: 64
            backbone_learning_rate: 1.0e-4

  # Swapping a model is an edit to one run: its backbone, trunk, target or recipe.
  runs:
    - name: hl60_alphagenome
      seed: 0
      recipe: curriculum
      backbone:
        type: alphagenome
        pretrained: all_folds
      trunk: cached
      target: region_counts
      target_group: HL-60
      # 1 Mb context, keeping the central 512 kb per window (>= 256 kb of context on
      # each side of every kept bin).
      cache:
        context: 1048576
        stride: 524288

    # Flashzoi baseline through the same path; its fixed 524,288 bp input tiles by
    # its own output span, so context/stride don't apply.
    - name: hl60_flashzoi
      seed: 0
      recipe: curriculum
      backbone:
        type: borzoi
        pretrained: johahi/flashzoi-replicate-0
      trunk: cached
      target: region_counts
      target_group: HL-60
      cache:
        pool_to: 128

    # AlphaGenome's CNN encoder only: 1536-d 128 bp features from 4 kb windows keeping
    # the central 2 kb (>= 1 kb of context either side), so short and cheap to cache. The
    # reverse-complement pass is cached too, for train-time RC augmentation.
    - name: hl60_alphagenome_encoder
      seed: 0
      recipe: curriculum
      backbone:
        type: alphagenome
        pretrained: all_folds
        features: encoder
      trunk: cached
      target: region_counts
      target_group: HL-60
      cache:
        rc: true
        batch_size: 64

    # The encoder, now live and fine-tuned: LoCon adapters on its conv layers, trained on
    # each region's own 4 kb window with RC and +/-32 bp shift augmentation. Warm-starts
    # from the cached encoder run's specific stage, so only the target stage runs here.
    - name: hl60_alphagenome_encoder_finetune
      seed: 0
      recipe: encoder_finetune
      init_from: hl60_alphagenome_encoder/specific
      backbone:
        type: alphagenome
        pretrained: all_folds
        features: encoder
      trunk: live
      target: region_counts
      target_group: HL-60
