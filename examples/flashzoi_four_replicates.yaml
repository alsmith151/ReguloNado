# Four independent FlashZoi runs. Replace the three input paths before use.
results_dir: results

inputs:
  fasta: /path/to/genome.fa
  bigwig_dir: /path/to/bigwigs
  drop_missing: true
  dedupe_tracks: content

targets:
  profile:
    intervals: /path/to/intervals.bed
    context_length: 524288
    bin_size: 32
    n_pred_bins: 6144
    shift_max_bp: 64
    extract_threads: 32
    write_threads: 4
    zstd_level: 3
    rows_per_row_group: 1
    stage_to_scratch: true


scaling:
  method: tmm

train:
  nproc_per_node: 2

  # These settings apply to every phase of every run. Phase and run settings
  # can override them locally.
  common:
    trainer:
      num_workers: 8
      report_to: [wandb]

  recipes:
    finetune:
      - name: head_only
        preset: head_only
      - name: unfreeze_output
        preset: unfreeze_output
      - name: deep_finetune
        preset: deep_finetune
      - name: peak_finetune
        preset: peak_finetune

  runs:
    - name: flashzoi_0
      seed: 0
      recipe: finetune
      backbone:
        type: borzoi
        pretrained: johahi/flashzoi-replicate-0
    - name: flashzoi_1
      seed: 1
      recipe: finetune
      backbone:
        type: borzoi
        pretrained: johahi/flashzoi-replicate-1
    - name: flashzoi_2
      seed: 2
      recipe: finetune
      backbone:
        type: borzoi
        pretrained: johahi/flashzoi-replicate-2
    - name: flashzoi_3
      seed: 3
      recipe: finetune
      backbone:
        type: borzoi
        pretrained: johahi/flashzoi-replicate-3
