# Replace the placeholder partitions, accounts, and GPU request for your site.
executor: slurm
jobs: 8
latency-wait: 60
rerun-incomplete: true
printshellcmds: true

default-resources:
  slurm_partition: CHANGEME_CPU_PARTITION
  slurm_account: CHANGEME_ACCOUNT
  runtime: 240
  mem_mb: 16000
  cpus_per_task: 1

set-resources:
  build_dataset:
    runtime: 1440
    mem_mb: 256000
    cpus_per_task: 32
  recompress_dataset:
    runtime: 720
    mem_mb: 128000
    cpus_per_task: 8
  train_phase:
    slurm_partition: CHANGEME_GPU_PARTITION
    slurm_account: CHANGEME_GPU_ACCOUNT
    slurm_extra: "'--gres=gpu:2'"
    runtime: 1440
    mem_mb: 256000
    cpus_per_task: 16
