# Is the region-count head limited by its features or by its capacity?
#
# data.overfit_probe trains on N train regions and evaluates on those same N (no RC or
# shift augmentation at eval), so every eval_* metric is fit to the training data. The
# 09-27 specificity runs found pretrain train and eval losses matching (3.02 / 3.00): the
# head underfits. This grid asks, per feature cache, how close each head size gets to a
# perfect fit:
#   - every head saturates at the same ceiling      -> the features are the limit;
#   - wider / per_group heads keep climbing         -> capacity is the limit;
#   - one cache's ceiling sits well above another's -> that trunk carries the signal.
#
# Regularisation is off (dropout 0, weight decay 0, no RC augmentation, no early
# stopping): this is a memorisation test, not a generalisation one. Do not compare these
# eval numbers against ordinary runs.
#
# Run through the pipeline's parameter-sweep stage (parameter_sweeps.region_overfit in
# 2026-09-27-hl60-specificity-directions), from the UEF repo root:
#
#   regulonado pipeline /path/to/ReguloNado/examples/2026-09-27-hl60-specificity-directions.yaml parameter-sweep
#
# The stage copies 16384 random train regions of each embedding cache below (the sweep's
# embeddings_from / embeddings_subset) to
# results/.../parameter-sweeps/embeddings/<cache>-train16384, once, then creates the sweep
# and runs one-GPU agents. Trials read those ~1 GB copies into RAM: opening a full 40-64 GB
# cache memory-mapped reads through all of it on Ceph, which every trial would otherwise
# repeat. Paths are relative to the UEF repo root, where the pipeline runs. The CNN encoder
# has its own sweeps, run live: 2026-09-27-hl60-encoder-overfit-{frozen,locon}-sweep.
#
# 2 caches x 5 widths x 2 poolings x 2 learning rates = 40 trials of 4000 steps each; each
# lands in results/2026-09-26-hl60-region-counts/parameter-sweeps/region_overfit/runs/.
#
# First run (W&B sweep kkh934og, from the full caches), fit to the training regions:
# AlphaGenome trunk contrast_pearson_mean 0.84 (hidden 256) -> 0.89 (512) -> 0.94 (1024)
# -> 0.97 (2048) -> 0.977 (4096), HL-60 0.94 -> 0.998, at lr 1e-3; 3e-3 was worse at every
# width, most at the widest (0.92 at 4096); per_group and shared pooling within 0.005.
# The features are not the limit on fitting HL-60 specificity; generalisation is.
program: regulonado
name: hl60-region-overfit
method: grid

metric:
  # Fit to the training regions, across every cell type. eval/loss and
  # eval/contrast_pearson_HL-60 are logged alongside for the same runs.
  name: eval/contrast_pearson_mean
  goal: maximize

parameters:
  target:
    value: region_counts
  # The pretrain preset (every region, no filtering or weighting), with its plateau
  # schedule and early stopping replaced below.
  preset:
    value: pretrain
  data.path:
    value: results/2026-09-26-hl60-region-counts/region_counts/dataset
  # Features: AlphaGenome full trunk (1 Mb context), Flashzoi (524 kb, pooled to 128 bp).
  # The pipeline's 16384-region copies of the hl60_alphagenome_trunk and
  # hl60_flashzoi_trunk caches.
  data.embeddings_dir:
    values:
      - results/2026-09-26-hl60-region-counts/parameter-sweeps/embeddings/alphagenome-all_folds-ctx1048576-stride524288-train16384
      - results/2026-09-26-hl60-region-counts/parameter-sweeps/embeddings/borzoi-johahi_flashzoi-replicate-0-pool128-train16384
  data.target_group:
    value: HL-60
  # Every region of the copies (the sweep's embeddings_subset): 64 steps per epoch at
  # batch 256, so 4000 steps is ~60 passes over each region -- enough to memorise if the
  # head can. The rest of the dataset is not in the copies, so it is dropped.
  data.overfit_probe:
    value: 16384
  data.drop_missing_from_cache:
    value: true
  data.enable_rc_aug:
    value: false
  # The ~1 GB copy is read into RAM once per trial.
  data.in_memory:
    value: true

  # The head: attention pool -> Linear(d, hidden) -> GELU -> Dropout -> readout. hidden is
  # its only width knob (depth is fixed at one hidden layer); 512 is the current default,
  # 2048 the 09-27 _wide runs.
  model.hidden:
    values: [256, 512, 1024, 2048, 4096]
  model.pooling:
    values: [shared, per_group]
  model.dropout:
    value: 0.0

  trainer.learning_rate:
    values: [1.0e-3, 3.0e-3]
  trainer.weight_decay:
    value: 0.0
  trainer.scheduler:
    value: cosine
  trainer.warmup_steps:
    value: 100
  trainer.early_stopping_patience:
    value: null
  trainer.batch_size:
    value: 256
  trainer.eval_batch_size:
    value: 1024
  trainer.max_steps:
    value: 4000
  trainer.eval_every_n_steps:
    value: 200
  trainer.checkpoint_every_n_steps:
    value: 200
  trainer.metric_for_best_model:
    value: eval_contrast_pearson_mean
  trainer.wandb_job_type:
    value: overfit-probe
  trainer.wandb_tags:
    value: [overfit-probe, hl60]

command:
  - ${env}
  - ${program}
  - sweep-train
  - ${args_json_file}
