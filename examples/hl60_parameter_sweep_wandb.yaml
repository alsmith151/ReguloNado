program: regulonado
method: grid
metric:
  # Distance from calibrated total ratio (1.0) in log space; zero is optimal.
  name: eval_abs_log_ratio_total_median
  goal: minimize
parameters:
  preset:
    value: head_only
  data.path:
    value: /path/to/results/dataset
  data.metadata_path:
    value: /path/to/results/dataset/tracks.parquet
  data.apply_squash:
    value: false
  backbone.pretrained_name:
    value: johahi/flashzoi-replicate-0
  loss:
    values: [poisson_multinomial, poisson_multinomial_binwise, poisson_nll, transfer_calibration]
  loss.poisson_weight:
    values: [0.2, 1.0, 5.0, 20.0]
  trainer.learning_rate:
    values: [0.0001, 0.001, 0.01]
  model.activation_type:
    values: [softplus, softplus_beta2, exp]
  head.output_init:
    values: [default, empirical_mean_bias, empirical_mean_constant]
  # Short ranking trials: a fixed step budget, evaluated (and checkpointed) twice.
  trainer.max_steps:
    value: 500
  trainer.eval_every_n_steps:
    value: 250
  trainer.report_to:
    value: [wandb]
command:
  - ${env}
  - ${program}
  - sweep-train
  - ${args_json_file}
