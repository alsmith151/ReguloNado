program: regulonado
method: grid
metric:
  # Distance from calibrated total ratio (1.0) in log space; zero is optimal.
  name: eval_abs_log_ratio_total_median
  goal: minimize
parameters:
  dataset_dir:
    value: /path/to/results/dataset
  metadata:
    value: /path/to/results/dataset/tracks.parquet
  pretrained_model:
    value: johahi/flashzoi-replicate-0
  loss:
    values: [poisson_multinomial, poisson_multinomial_binwise, poisson_nll, transfer_calibration]
  poisson_weight:
    values: [0.2, 1.0, 5.0, 20.0]
  learning_rate:
    values: [0.0001, 0.001, 0.01]
  activation_type:
    values: [softplus, softplus_beta2, exp]
  output_init:
    values: [default, empirical_mean_bias, empirical_mean_constant]
  max_steps:
    value: 500
command:
  - ${env}
  - ${program}
  - train
  - ${dataset_dir}
  - --preset
  - head_only
  - --metadata
  - ${metadata}
  - --set
  - backbone.pretrained_name=${pretrained_model}
  - --set
  - loss.name=${loss}
  - --set
  - loss.poisson_weight=${poisson_weight}
  - --set
  - model.activation_type=${activation_type}
  - --set
  - head.output_init=${output_init}
  - --set
  - trainer.learning_rate=${learning_rate}
  - --set
  - trainer.max_steps=${max_steps}
  - --set
  - trainer.report_to=[wandb]
