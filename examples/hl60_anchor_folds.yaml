# HL-60 / AML-BM atlas anchor-scaled training experiment.
#
# This follows the four-fold training layout used by the previous HL-60 design
# run. Replace the atlas input paths and checkpoint paths if running elsewhere.
# The anchor/background assets below are the validated outputs of a prior
# enhancer-finding run.

# Reuses dataset/dataset_dict.json already built under this result tree.
results_dir: /path/to/regulonado_models

inputs:
  intervals: /path/to/intervals.bed.gz
  fasta: /path/to/genome.fa
  bigwig_dir: /path/to/bigwigs

dataset:
  context_length: 524288
  bin_size: 32
  n_pred_bins: 6144
  shift_max_bp: 64
  extract_threads: 32
  arrow_write_threads: 4
  arrow_batch_size: 512
  compression: lz4
  stage_to_scratch: true
  drop_missing: true
  dedupe_tracks: content

recompress:
  # The existing dataset is used directly; no dataset_rechunked output is made.
  enabled: false
  zstd_level: 3
  max_batch_size: 4
  workers: 8

scaling:
  method: anchor
  anchor_regions: /path/to/common_essential_windows.bed
  background_regions: /path/to/null_windows.parquet
  heldout_regions: /path/to/common_essential_windows_heldout.bed
  window_stat_bp: 1000
  background_sample: 5000

train:
  nproc_per_node: 2
  common:
    data.apply_squash: false
    trainer:
      num_workers: 8
      report_to: [wandb]

  phases:
    - name: head_only
      preset: head_only
    - name: unfreeze_output
      preset: unfreeze_output

  runs:
    - name: fold_0
      seed: 0
      pretrained_model: johahi/flashzoi-replicate-0
    - name: fold_1
      seed: 1
      pretrained_model: johahi/flashzoi-replicate-1
    - name: fold_2
      seed: 2
      pretrained_model: johahi/flashzoi-replicate-2
    - name: fold_3
      seed: 3
      pretrained_model: johahi/flashzoi-replicate-3
