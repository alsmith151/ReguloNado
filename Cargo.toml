[package]
name = "regulonado_rs"
version = "0.1.0"
edition = "2021"
description = "Fast BigWig/FASTA to Arrow dataset construction for sequence-to-function genomics models"
license = "BSD-3-Clause"
repository = "https://github.com/alsmith151/ReguloNado"
readme = "README.md"
authors = ["alsmith <asmith151@googlemail.com>"]
keywords = ["genomics", "bioinformatics", "bigwig", "arrow"]
categories = ["science"]
rust-version = "1.90"

[lib]
name = "regulonado_rs"
crate-type = ["cdylib"]

[dependencies]
bamnado = { git = "https://github.com/alsmith151/BamNado.git", rev = "d04428dd9e1559e12f200377b4f426b25a3dd81e" }
noodles = { version = "0.103.0", features = ["bam", "sam", "bgzf", "core", "csi"] }
ahash = "0.8"
serde = { version = "1", features = ["derive"] }
pyo3 = { version = "0.23", features = ["extension-module"] }
bigtools = { version = "0.5", default-features = false, features = ["read"] }
rayon = "1"
arrow-array = "56"
arrow-buffer = "56"
arrow-schema = "56"
parquet = { version = "56", default-features = false, features = ["arrow", "zstd"] }
serde_json = "1"

[profile.release]
lto = true
codegen-units = 1
opt-level = 3

[workspace]
