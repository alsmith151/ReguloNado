[package]
name = "regulonado_rs"
version = "0.2.0"
edition = "2021"
description = "Fast BigWig/FASTA to Arrow dataset construction for sequence-to-function genomics models"
license = "BSD-3-Clause"
repository = "https://github.com/alsmith151/ReguloNado"
readme = "README.md"
authors = ["alsmith <asmith151@googlemail.com>"]
keywords = ["genomics", "bioinformatics", "bigwig", "arrow"]
categories = ["science"]
rust-version = "1.85"

[lib]
name = "regulonado_rs"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.23", features = ["extension-module"] }
bigtools = { version = "0.5", default-features = false, features = ["read"] }
rayon = "1"
arrow-array = "56"
arrow-buffer = "56"
arrow-ipc = { version = "56", features = ["lz4", "zstd"] }
arrow-schema = "56"
serde_json = "1"

[profile.release]
lto = true
codegen-units = 1
opt-level = 3

[workspace]
