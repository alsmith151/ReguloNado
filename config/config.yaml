# ReguloNado workflow configuration.
#
# Copy this file, edit the paths, and run:
#   snakemake --configfile config/config.yaml -n     # dry run, shows the DAG
#   snakemake --configfile config/config.yaml --profile workflow/profiles/slurm
#
# Every path below is a placeholder. Nothing here is specific to any one cluster —
# SLURM partitions, accounts and GPU types live in the executor profile, not here.

# ---------------------------------------------------------------------------
# Where everything lands. All workflow outputs are written under results_dir.
# ---------------------------------------------------------------------------
results_dir: results

# ---------------------------------------------------------------------------
# Inputs
# ---------------------------------------------------------------------------
inputs:
  # BED of training intervals. Column 4 is used as the fold/split label.
  intervals: /path/to/intervals.bed
  # Reference FASTA. Must be indexed (.fai alongside it) and must use the same
  # contig naming as the BED — a contig in the BED that is absent from the FASTA
  # is now a hard error rather than silently producing blank rows.
  fasta: /path/to/genome.fa
  # Directory of BigWig tracks, one file per track.
  bigwig_dir: /path/to/bigwigs

# ---------------------------------------------------------------------------
# Dataset construction — `regulonado build`
# ---------------------------------------------------------------------------
build:
  context_length: 524288
  bin_size: 32
  n_pred_bins: 6144
  shift_max_bp: 64
  # Rayon threads for BigWig extraction. Match this to the rule's cpus_per_task.
  extract_threads: 32
  # Concurrent Arrow shard writers per chromosome scan. 4 suits a 256 GB job;
  # 6-8 may help at 512 GB if profiling shows I/O headroom.
  arrow_write_threads: 4
  # Auto-capped to floor(2^31 / (n_tracks * n_bins)) to avoid Arrow i32 overflow.
  arrow_batch_size: 512
  compression: lz4
  # Copy FASTA + BigWigs to node-local scratch before building. On networked
  # storage this is the single biggest performance lever — extraction is
  # I/O-bound there. Needs roughly n_tracks * avg_bigwig_size of free scratch.
  stage_to_scratch: true
  drop_missing: true
  dedupe_tracks: content

# ---------------------------------------------------------------------------
# Rechunking — `regulonado recompress-dataset`
# Rebatches into small record batches and recompresses with zstd, which speeds
# up random-access reads during training.
# ---------------------------------------------------------------------------
recompress:
  enabled: true
  zstd_level: 3
  max_batch_size: 4
  workers: 8

# ---------------------------------------------------------------------------
# Scale factors
#   method: tmm      -> `regulonado calculate-tmm-scaling`  (needs no extra tools)
#           original -> `regulonado calculate-original-scaling` (needs the BamNado
#                       binary on PATH; it cannot be installed by pip)
# ---------------------------------------------------------------------------
scaling:
  method: tmm

# ---------------------------------------------------------------------------
# Training phases.
#
# Phases run in order. Each warm-starts from the best checkpoint of the previous
# one, resolved from that run's trainer_state.json. To run fewer phases, delete
# entries from this list — the DAG follows the list, so no code changes needed.
#
# `experiment` names a Hydra config in python/configs/experiment/.
# ---------------------------------------------------------------------------
train:
  wandb_project: regulonado
  nproc_per_node: 2
  phases:
    - name: head_only
      experiment: head_only_borzoi
    - name: stage2_unfreeze2
      experiment: stage2_unfreeze2_borzoi
    - name: stage3_deep_finetune
      experiment: stage3_deep_finetune_borzoi
    - name: stage4_peak_finetune
      experiment: stage4_peak_finetune_borzoi

# ---------------------------------------------------------------------------
# Prediction — `regulonado predict`
#
# Runs against the final training phase's best checkpoint. Set regions to a BED
# to predict specific loci, or leave it null for whole-genome prediction.
# ---------------------------------------------------------------------------
predict:
  enabled: false
  regions: null
  batch_size: 8
  inverse_squash: true
