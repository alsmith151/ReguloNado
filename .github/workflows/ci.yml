name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v6

      - name: Install ruff
        run: pip install ruff

      - name: ruff check
        run: ruff check python/ tests/

      - name: uv lock check
        run: uv lock --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/
          key: ${{ runner.os }}-clippy-${{ hashFiles('Cargo.lock') }}

      - name: cargo clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: cargo fmt check
        run: cargo fmt --check

      - name: cargo test
        run: cargo test --all-targets

  test:
    name: "Data tests — Python ${{ matrix.python-version }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/
          key: ${{ runner.os }}-cargo-${{ matrix.python-version }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ matrix.python-version }}-
            ${{ runner.os }}-cargo-

      - name: Core install imports without the data/train extras
        run: |
          pip install .
          python -c "import regulonado.config.models, regulonado.config.schema_gen, regulonado.tracks_table, regulonado.normalization"

      - name: Install with test dependencies
        run: pip install ".[test,workflow]"

      - name: Run full Python test suite
        run: pytest tests/ -q

      - name: Check config.schema.yaml matches the pydantic models
        run: |
          python -m regulonado.config.schema_gen
          git diff --exit-code -- python/regulonado/workflow/schemas/config.schema.yaml

  test-model:
    # The model/loss/metric tests import torch, which the [test] extra deliberately
    # omits to keep the data-path job small. Installing the CPU-only torch build here
    # lets these four files run in CI without a GPU — they need no network access and
    # no pretrained weights (from_pretrained is pointed at tmp_path).
    name: "Model tests — CPU torch"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/
          key: ${{ runner.os }}-cargo-model-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install CPU-only torch
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu

      # regulonado.model imports borzoi_pytorch at module scope, and train.py imports
      # hydra, so these are needed just to collect the tests. The models themselves
      # need CUDA to run, but these tests use dummy adapters and stay on CPU.
      - name: Install package and model test dependencies
        run: |
          pip install ".[test]" \
            transformers torchmetrics accelerate peft \
            hydra-core borzoi-pytorch enformer-pytorch matplotlib

      - name: Run model, loss, prediction and metric tests
        run: |
          pytest \
            tests/test_losses.py \
            tests/test_model_transfer.py \
            tests/test_predict_bigwig.py \
            tests/test_train_metrics.py \
            tests/test_design.py \
            tests/test_attribution.py \
            tests/test_normalization_anchor.py \
            tests/test_cli.py -v

  test-extras:
    name: "Extra imports — Python ${{ matrix.python-version }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
        extra: ["core", "data", "train", "workflow"]

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/
          key: ${{ runner.os }}-cargo-extras-${{ matrix.python-version }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-extras-${{ matrix.python-version }}-
            ${{ runner.os }}-cargo-extras-
            ${{ runner.os }}-cargo-

      - name: Install package with ${{ matrix.extra }} extra
        run: |
          if [ "${{ matrix.extra }}" = "core" ]; then
            pip install .
            python -c "import regulonado"
          elif [ "${{ matrix.extra }}" = "data" ]; then
            pip install ".[data]"
            python -c "import regulonado, regulonado.dataset"
          elif [ "${{ matrix.extra }}" = "train" ]; then
            pip install ".[train]"
            python -c "import regulonado, regulonado.training"
          elif [ "${{ matrix.extra }}" = "workflow" ]; then
            pip install ".[workflow]"
            python -c "import regulonado, regulonado.workflow"
          fi
