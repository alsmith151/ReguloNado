program: experiments/calibration-sweep/train_on_cache.py
method: bayes
metric:
  name: total_ratio_error
  goal: minimize
parameters:
  overrides:
    values:
      - "loss=poisson_multinomial trainer.learning_rate=0.0001"
      - "loss=poisson_multinomial trainer.learning_rate=0.001"
      - "loss=poisson_multinomial trainer.learning_rate=0.01"
      - "loss=poisson_multinomial poisson_weight=1 trainer.learning_rate=0.001"
      - "loss=poisson_multinomial poisson_weight=5 trainer.learning_rate=0.001"
      - "loss=poisson_multinomial_binwise trainer.learning_rate=0.001"
      - "loss=poisson_nll trainer.learning_rate=0.001"
      - "loss=topk_additive topk_fraction=0.04 trainer.learning_rate=0.001"
      - "loss=topk_reweight topk_fraction=0.04 trainer.learning_rate=0.001"
      - "loss=transfer_calibration trainer.learning_rate=0.001"
      - "loss=transfer_calibration head.output_bias_init=0.1 trainer.learning_rate=0.001"
      - "loss=poisson_multinomial_binwise model.activation_type=exp trainer.learning_rate=0.001"
      - "loss=poisson_multinomial loss.weight_range=1.0 loss.weight_exp=1.0 trainer.learning_rate=0.001"
command:
  - ${env}
  - python
  - ${program}
  - ${args}
