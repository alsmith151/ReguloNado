[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "regulonado"
version = "0.1.0"
description = "Build Arrow datasets from BigWig/FASTA and finetune sequence-to-function genomics models"
requires-python = ">=3.12,<3.14"
readme = "README.md"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
authors = [{ name = "alsmith", email = "asmith151@googlemail.com" }]
keywords = ["genomics", "bioinformatics", "deep-learning", "bigwig", "arrow", "enformer", "borzoi"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Rust",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]

# Core: minimum to import the package and run the CLI without any ML deps.
# pandas/pyarrow/tqdm/pandera live here (not in `data`) because
# regulonado.tracks_table and regulonado.normalization need them at module
# scope — normalization.py already imported pandas/tqdm unconditionally, so
# this is a correction, not a loosening. pyarrow was previously undeclared at
# runtime, arriving only transitively via `datasets` in the `test` extra.
dependencies = [
    "loguru>=0.7",
    "numpy>=2",
    "pandas>=2",
    "pandera>=0.33",
    "pyarrow",
    "pyyaml",
    "pydantic>=2.0",
    "tqdm>=4.65",
    "typer",
]

[project.optional-dependencies]
# ── data pipeline (BigWig / Arrow / FASTA) ────────────────────────────────────
data = [
    "bioframe",
    "datasets>=5.0.0",
    "psutil",
    "pybigtools",
    "pysam>=0.23",
    "scipy",
]

# ── full training stack (includes data) ───────────────────────────────────────
train = [
    "regulonado[data]",
    "accelerate",
    "borzoi-pytorch",
    "enformer-pytorch",
    "hydra-core>=1.3",
    "lightning>=2.2",
    # Used by the example-plot training callback, not just the viz extra.
    "matplotlib",
    "peft",
    "torch>=2.5",
    "torchmetrics>=1.0",
    "transformers>=5.12.1",
    "wandb>=0.16",
]

# ── GPU / FlashAttention ──────────────────────────────────────────────────────
gpu = [
    "regulonado[train]",
    "ninja",
    "flash_attn>=2.6",
]

# ── visualisation ─────────────────────────────────────────────────────────────
viz = [
    "plotly",
    "seaborn",
    "matplotlib"
]

# ── Jupyter notebooks ─────────────────────────────────────────────────────────
jupyter = [
    "ipykernel",
    "ipywidgets",
    "jupyter",
    "jupyterlab",
    "nbformat",
]

# ── development ───────────────────────────────────────────────────────────────
dev = [
    "maturin>=1.0",
    "ninja",
    "pytest>=9.1.1",
    "ruff>=0.4",
]

# ── CI test suite (no torch/GPU needed) ───────────────────────────────────────
test = [
    "regulonado[data]",
    "pandera[strategies]",
    "pyfaidx",
    "pytest>=9.1.1",
]

# Snakemake workflow execution through the Python API.
workflow = [
    "snakemake>=9.12,<10",
]

# SeqNado interoperability: read tracks, sample metadata and normalisation
# factors straight out of a SeqNado project. Kept optional because SeqNado pins
# pydantic exactly and pulls in a full NGS stack that model training never needs.
# The project API (seqnado.open_project) is currently provided by SeqNado's
# main branch rather than a published release.
seqnado = [
    "seqnado @ git+https://github.com/Milne-Group/SeqNado.git@main",
]

# ── convenience meta-extra ────────────────────────────────────────────────────
all = ["regulonado[data,train,viz]"]


[project.urls]
Repository = "https://github.com/alsmith151/ReguloNado"
Homepage = "https://github.com/alsmith151/ReguloNado"
Issues = "https://github.com/alsmith151/ReguloNado/issues"

[project.scripts]
regulonado = "regulonado.cli.app:main"

[tool.maturin]
# Modern maturin mixed layout:
#   src/     → Rust source (src/lib.rs)
#   python/  → Python packages
# Extension is installed as regulonado._rs (inside the regulonado package).
python-source = "python"
module-name = "regulonado._rs"
features = ["pyo3/extension-module"]
include = ["python/configs/**/*.yaml", "python/regulonado/workflow/**/*"]
exclude = ["tests/bench_*", "notes.md", "scripts/**/*", ".github/**/*"]

[tool.uv]
# ReguloNado supports POSIX platforms only; SeqNado's optional metadata is not
# compatible with the Windows resolution split.
environments = ["sys_platform == 'darwin'", "sys_platform == 'linux'"]
# SeqNado main still publishes an older Pandera upper bound; its API is
# compatible with ReguloNado's supported Pandera range.
override-dependencies = ["pandera>=0.33"]
extra-build-dependencies = { flash-attn = ["torch", "psutil", "ninja"] }

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cu124", marker = "sys_platform == 'linux'" },
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
